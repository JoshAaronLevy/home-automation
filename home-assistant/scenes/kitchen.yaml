- id: kitchen_cleanup
  name: Kitchen Cleanup
  entities:
    light.kitchen_cans:
      state: "on"
      brightness: 255
    light.kitchen_sink:
      state: "on"
      brightness: 255
    light.kitchen_nook:
      state: "on"
      brightness: 180
