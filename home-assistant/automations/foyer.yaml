# Foyer behavior is intentionally simple for the initial rollout.
# TODO: Replace placeholder Lutron event payloads and device IDs with real values.

- id: foyer_main_pico_on
  alias: Foyer Pico - On
  description: Explicitly turns on foyer_main from the foyer Pico.
  mode: single
  trigger:
    - platform: event
      event_type: lutron_caseta_button_event
      event_data:
        device_id: pico_foyer_main
        button: "on"
        action: press
  condition: []
  action:
    - service: script.foyer_main_on

- id: foyer_main_pico_off
  alias: Foyer Pico - Off
  description: Explicitly turns off foyer_main from the foyer Pico.
  mode: single
  trigger:
    - platform: event
      event_type: lutron_caseta_button_event
      event_data:
        device_id: pico_foyer_main
        button: "off"
        action: press
  condition: []
  action:
    - service: script.foyer_main_off
