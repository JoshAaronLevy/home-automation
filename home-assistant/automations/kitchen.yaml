# Kitchen automations reflect the actual first-floor zone model.
# Initial rollout is intentionally simple and explicit.
# TODO: Replace placeholder Lutron event payloads and device IDs with real values.

- id: kitchen_cans_pico_a_on
  alias: Kitchen Cans Pico A - On
  description: Explicitly turns on kitchen_cans from the first kitchen Pico location.
  mode: single
  trigger:
    - platform: event
      event_type: lutron_caseta_button_event
      event_data:
        device_id: pico_kitchen_cans_a
        button: "on"
        action: press
  condition: []
  action:
    - service: script.kitchen_cans_on

- id: kitchen_cans_pico_a_off
  alias: Kitchen Cans Pico A - Off
  description: Explicitly turns off kitchen_cans from the first kitchen Pico location.
  mode: single
  trigger:
    - platform: event
      event_type: lutron_caseta_button_event
      event_data:
        device_id: pico_kitchen_cans_a
        button: "off"
        action: press
  condition: []
  action:
    - service: script.kitchen_cans_off

- id: kitchen_cans_pico_b_on
  alias: Kitchen Cans Pico B - On
  description: Explicitly turns on kitchen_cans from the second kitchen Pico location.
  mode: single
  trigger:
    - platform: event
      event_type: lutron_caseta_button_event
      event_data:
        device_id: pico_kitchen_cans_b
        button: "on"
        action: press
  condition: []
  action:
    - service: script.kitchen_cans_on

- id: kitchen_cans_pico_b_off
  alias: Kitchen Cans Pico B - Off
  description: Explicitly turns off kitchen_cans from the second kitchen Pico location.
  mode: single
  trigger:
    - platform: event
      event_type: lutron_caseta_button_event
      event_data:
        device_id: pico_kitchen_cans_b
        button: "off"
        action: press
  condition: []
  action:
    - service: script.kitchen_cans_off

