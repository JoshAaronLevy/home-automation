- id: hallway_time_based_on
  alias: Hallway - Time Aware On
  description: Example hallway automation that selects brightness based on time of day.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.hallway_motion_placeholder
      to: "on"
  condition: []
  action:
    - choose:
        - conditions:
            - condition: time
              after: "06:00:00"
              before: "22:00:00"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.hallway_govee_main
              data:
                brightness_pct: 80
      default:
        - service: light.turn_on
          target:
            entity_id: light.hallway_govee_main
          data:
            brightness_pct: 20
