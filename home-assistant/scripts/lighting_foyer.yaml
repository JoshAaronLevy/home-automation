# TODO: Replace placeholder entity IDs with the real Home Assistant entities or groups.

foyer_main_on:
  alias: Foyer Main On
  icon: mdi:door-open
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.foyer_main
      data:
        brightness_pct: 85
        transition: 1

foyer_main_off:
  alias: Foyer Main Off
  icon: mdi:lightbulb-off
  sequence:
    - service: light.turn_off
      target:
        entity_id: light.foyer_main
