kitchen_bright:
  alias: Kitchen Bright
  icon: mdi:lightbulb-on
  sequence:
    - service: light.turn_on
      target:
        entity_id:
          - light.kitchen_govee_main
          - light.kitchen_govee_accent
      data:
        brightness_pct: 100
        transition: 1

kitchen_evening:
  alias: Kitchen Evening
  icon: mdi:weather-night
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.kitchen_evening
